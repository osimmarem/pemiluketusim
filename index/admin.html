<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel Admin · E-VOTE OSIM</title>
<style>
:root{--navy:#123F70;--blue:#1769AA;--sky:#63A9E8;--light:#D8ECFF;--ice:#EAF5FF;--txt:#18344F;--red:#b3261e;--ok:#1b7f4b}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--ice);color:var(--txt);line-height:1.5}
h1,h2,h3{color:var(--navy);margin:0 0 .5rem;line-height:1.25}h1{font-size:1.5rem}h2{font-size:1.2rem}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(18,63,112,.08);padding:1.25rem;margin-bottom:1rem}
.btn{display:inline-block;min-height:44px;padding:.6rem 1.1rem;border:0;border-radius:12px;background:var(--blue);color:#fff;font:inherit;font-weight:600;cursor:pointer;text-align:center}
.btn:hover{background:var(--navy)}.btn:disabled{opacity:.6;cursor:wait}.btn.alt{background:var(--light);color:var(--navy)}.btn.red{background:var(--red)}.btn.sm{min-height:34px;padding:.25rem .7rem;font-size:.9rem}.btn.full{width:100%}
input,select,textarea{width:100%;min-height:44px;padding:.55rem .75rem;border:1px solid #b9d3ea;border-radius:10px;font:inherit;color:var(--txt);background:#fff}
textarea{min-height:80px}label{display:block;font-weight:600;margin:.75rem 0 .25rem;font-size:.92rem}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.err{color:var(--red);min-height:1.4em;margin:.5rem 0}.msg{background:var(--light);border-radius:10px;padding:.75rem;margin:.75rem 0}
.grid{display:grid;gap:1rem;grid-template-columns:1fr}
@media(min-width:768px){.grid.c2{grid-template-columns:repeat(2,1fr)}.grid.s{grid-template-columns:repeat(2,1fr)}}
@media(min-width:992px){.grid.c3{grid-template-columns:repeat(3,1fr)}.grid.s{grid-template-columns:repeat(3,1fr)}}
.stat b{font-size:1.8rem;color:var(--navy);display:block}.stat span{color:var(--blue);font-size:.9rem}
.tag{display:inline-block;padding:.1rem .6rem;border-radius:999px;background:var(--light);color:var(--navy);font-weight:600;font-size:.85rem}.tag.ok{background:#d9f3e4;color:var(--ok)}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{padding:.5rem;border-bottom:1px solid var(--light);text-align:left;white-space:nowrap}th{color:var(--navy);background:var(--ice)}
.bar{height:22px;background:var(--light);border-radius:8px;overflow:hidden;margin:.25rem 0 .75rem}.bar i{display:block;height:100%;background:var(--blue)}
.tok{font-family:ui-monospace,Consolas,monospace;letter-spacing:.06em}
.login{max-width:420px;margin:8vh auto;padding:1rem}
.adm{display:block}.side{background:var(--navy);color:#fff;padding:1rem}.side h2{color:#fff;margin:0}.side small{color:var(--sky)}
.side nav{display:none;flex-direction:column;gap:.25rem;margin-top:.75rem}.side nav.open{display:flex}
.side nav a{color:#fff;text-decoration:none;padding:.65rem .75rem;border-radius:10px}.side nav a.on,.side nav a:hover{background:var(--blue)}
.burger{float:right;background:transparent;border:1px solid #fff;color:#fff;border-radius:10px;min-height:44px;padding:0 .9rem;font-size:1.2rem}
.main{padding:1rem}
@media(min-width:992px){.adm{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.burger{display:none}.side nav{display:flex}.side{position:sticky;top:0;height:100vh}.main{padding:1.5rem}}
@media print{.side,.noprint{display:none!important}.adm{display:block}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,getDoc,getDocs,setDoc,updateDoc,deleteDoc,addDoc,collection,query,orderBy,limit,writeBatch,serverTimestamp,Timestamp,getCountFromServer} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig={apiKey:"AIzaSyCy2ZIkIrHOkqGjZe8quPudJHtQVdBodpY",authDomain:"pemilihanketusim.firebaseapp.com",projectId:"pemilihanketusim",storageBucket:"pemilihanketusim.firebasestorage.app",messagingSenderId:"424672989010",appId:"1:424672989010:web:f8bc0f380a605e51a1f48b"};
const fb=initializeApp(firebaseConfig),db=getFirestore(fb),auth=getAuth(fb);

const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const H=async x=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x));return[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')};
const rnd=n=>{const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789',a=new Uint32Array(n);crypto.getRandomValues(a);return[...a].map(v=>A[v%A.length]).join('')};
const ST={draft:'Draft',siap:'Siap',berlangsung:'Berlangsung',selesai:'Selesai'};
const fmt=t=>t?t.toDate().toLocaleString('id-ID',{timeZone:'Asia/Jakarta'}):'belum diatur';
const loc=t=>{if(!t)return'';const d=t.toDate();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const log=(aksi,detail='')=>addDoc(collection(db,'audit'),{aksi,detail,by:auth.currentUser?.email||'',t:serverTimestamp()}).catch(()=>{});
const img2url=(f,max,type,q)=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL(type,q))};i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(f)});
const guard=fn=>async(...a)=>{try{return await fn(...a)}catch(e){alert('Gagal: '+(e.code==='permission-denied'?'tidak diizinkan oleh aturan keamanan (mungkin pemilihan sudah dimulai).':(e.message||e)));}};
let E={status:'draft'};

/* ---------- Login ---------- */
function loginView(msg=''){
  app.innerHTML=`<div class="login"><div class="card"><h1>Panel Admin</h1><p>E-VOTE OSIM · khusus panitia</p>
  <label for="em">Email</label><input id="em" type="email" autocomplete="username"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
  <div class="err" id="e" role="alert">${esc(msg)}</div><button class="btn full" id="b">Masuk</button></div></div>`;
  let fails=0;
  const run=async()=>{
    if(fails>=5){$('#e').textContent='Terlalu banyak percobaan. Muat ulang halaman setelah beberapa menit.';return}
    $('#b').disabled=true;
    try{await signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value)}
    catch(x){fails++;$('#e').textContent='Email atau password salah.';$('#b').disabled=false}
  };
  $('#b').onclick=run;$('#pw').onkeydown=e=>{if(e.key==='Enter')run()};
}
onAuthStateChanged(auth,async u=>{
  if(!u)return loginView();
  try{
    const a=await getDoc(doc(db,'admins',u.uid));
    if(!a.exists()){await signOut(auth);return loginView('Akun ini bukan admin.')}
    const e=await getDoc(doc(db,'elections','main'));
    if(!e.exists()){await setDoc(doc(db,'elections','main'),{nama:'Pemilihan Ketua dan Wakil Ketua OSIM',periode:'',status:'draft',mulai:null,selesai:null})}
    log('Login admin');shell();
  }catch(x){console.error(x);await signOut(auth);loginView('Gagal memuat akun. Kode error: '+(x.code||x.message||x))}
});
window.addEventListener('hashchange',()=>auth.currentUser&&shell());

/* ---------- Shell & router ---------- */
const NAV=[['dashboard','Dashboard'],['branding','Identitas Portal'],['students','Data Pemilih'],['candidates','Kandidat'],['settings','Pengaturan'],['results','Hasil'],['audit','Audit']];
async function shell(){
  const r=(location.hash||'#/dashboard').slice(2)||'dashboard';
  E=(await getDoc(doc(db,'elections','main'))).data();
  app.innerHTML=`<div class="adm"><aside class="side"><button class="burger" id="bg" aria-label="Menu">☰</button><h2>E-VOTE OSIM</h2><small>Panel Admin</small>
  <nav id="nv">${NAV.map(n=>`<a href="#/${n[0]}" class="${r===n[0]?'on':''}">${n[1]}</a>`).join('')}<a href="#" id="lo">Keluar</a></nav></aside><main class="main" id="m"></main></div>`;
  $('#bg').onclick=()=>$('#nv').classList.toggle('open');
  $('#lo').onclick=async e=>{e.preventDefault();await log('Logout admin');await signOut(auth)};
  const P={dashboard:pDash,branding:pBrand,students:pStud,candidates:pCand,settings:pSet,results:pRes,audit:pAud};
  const m=$('#m');m.innerHTML='<p>Memuat…</p>';
  try{await (P[r]||pDash)(m)}catch(e){m.innerHTML=`<div class="card">Gagal memuat: ${esc(e.message)}</div>`}
}
const cnt=async c=>(await getCountFromServer(collection(db,c))).data().count;

/* ---------- Dashboard ---------- */
async function pDash(m){
  const [sd,cl,cd]=await Promise.all([getDocs(collection(db,'students')),cnt('claims'),cnt('candidates')]);
  const tot=sd.docs.filter(d=>d.data().on!==false).length,p=tot?Math.round(cl/tot*100):0;
  m.innerHTML=`<h1>Dashboard</h1><div class="grid s">${[['Total pemilih',tot],['Sudah memilih',cl],['Belum memilih',Math.max(tot-cl,0)],['Partisipasi',p+'%'],['Total kandidat',cd],['Status',ST[E.status]]].map(x=>`<div class="card stat" style="margin:0"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div>
  <div class="card" style="margin-top:1rem"><h2>Partisipasi</h2><div class="bar"><i style="width:${Math.min(p,100)}%"></i></div><small>${cl} dari ${tot} pemilih sudah memberikan suara.</small></div>
  <div class="card"><h2>Jadwal</h2><p>Mulai: ${fmt(E.mulai)}<br>Selesai: ${fmt(E.selesai)}</p></div>`;
}

/* ---------- Identitas portal ---------- */
async function pBrand(m){
  const b=(await getDoc(doc(db,'settings','branding'))).data()||{};let logo=b.logo||'';
  m.innerHTML=`<h1>Identitas Portal</h1><div class="card"><label>Nama portal</label><input id="pn" value="${esc(b.portal||'E-VOTE OSIM')}"><label>Nama sekolah</label><input id="sn" value="${esc(b.school||'')}">
  <label>Teks sambutan</label><textarea id="wl">${esc(b.welcome||'')}</textarea><label>Informasi footer</label><input id="ft" value="${esc(b.footer||'')}">
  <label>Logo — unggah file</label><input type="file" id="lf" accept="image/*"><label>atau URL logo</label><input id="lu" value="${esc(logo.startsWith('data:')?'':logo)}" placeholder="https://...">
  <p>Pratinjau:</p><img id="pv" alt="Pratinjau logo" style="max-height:72px" src="${esc(logo)}"><div class="row" style="margin-top:1rem"><button class="btn" id="sv">Simpan</button><button class="btn alt" id="rl">Pakai logo sementara</button></div></div>`;
  $('#lf').onchange=guard(async e=>{const f=e.target.files[0];if(!f)return;if(!/^image\/(png|jpeg|webp|gif)$/.test(f.type)||f.size>3e6)return alert('Logo harus PNG/JPG/WEBP/GIF maksimal 3 MB.');logo=await img2url(f,256,'image/png');$('#pv').src=logo;$('#lu').value=''});
  $('#lu').oninput=()=>{logo=$('#lu').value.trim();$('#pv').src=logo};
  $('#sv').onclick=guard(async()=>{await setDoc(doc(db,'settings','branding'),{portal:$('#pn').value.trim()||'E-VOTE OSIM',school:$('#sn').value.trim(),welcome:$('#wl').value.trim(),footer:$('#ft').value.trim(),logo});await log('Ubah identitas portal');alert('Tersimpan.')});
  $('#rl').onclick=guard(async()=>{logo='';$('#pv').removeAttribute('src');$('#lu').value='';await updateDoc(doc(db,'settings','branding'),{logo:''}).catch(()=>{});await log('Reset logo')});
}

/* ---------- Data pemilih & token ---------- */
async function pStud(m){
  const [sd,td]=await Promise.all([getDocs(collection(db,'students')),getDocs(collection(db,'tokens'))]);
  const S=sd.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.no).localeCompare(String(b.no),'id',{numeric:true}));
  const T={};td.docs.forEach(d=>T[d.data().sid]={id:d.id,used:d.data().used});
  const cls=[...new Set(S.map(s=>s.k))].sort();
  m.innerHTML=`<h1>Data Pemilih</h1><div id="tk"></div>
  <div class="card"><h2>Tambah siswa</h2><div class="grid c3"><div><label>Nomor siswa</label><input id="no"></div><div><label>Nama</label><input id="nm"></div><div><label>Kelas</label><input id="kl"></div></div>
  <div class="row" style="margin-top:1rem"><button class="btn" id="add">Tambah</button><label class="btn alt" style="margin:0;cursor:pointer">Impor CSV<input type="file" id="csv" accept=".csv,text/csv" hidden></label><button class="btn alt" id="all">Terbitkan token untuk semua</button></div><small>Format CSV: nomor, nama, kelas.</small></div>
  <div class="card"><div class="grid c2"><input id="q" placeholder="Cari nama atau nomor"><select id="fk"><option value="">Semua kelas</option>${cls.map(k=>`<option>${esc(k)}</option>`).join('')}</select></div>
  <div class="tw" style="margin-top:.75rem"><table><thead><tr><th>Nomor</th><th>Nama</th><th>Kelas</th><th>Hak pilih</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="tb"></tbody></table></div></div>
  <div class="card"><h2>Per kelas</h2>${cls.map(k=>{const a=S.filter(s=>s.k===k&&s.on!==false);return`<div>${esc(k)}: ${a.filter(s=>T[s.id]?.used).length}/${a.length} sudah memilih</div>`}).join('')||'Belum ada data.'}</div>`;
  const issue=guard(async ids=>{
    const out=[];let bt=writeBatch(db),n=0;
    for(const id of ids){const s=S.find(x=>x.id===id),p=rnd(10),h=await H(p);bt.set(doc(db,'tokens',h),{sid:id,used:false});out.push([s.no,s.n,s.k,p]);if(++n===400){await bt.commit();bt=writeBatch(db);n=0}}
    if(n)await bt.commit();await log('Terbitkan token',out.length+' token');
    $('#tk').innerHTML=`<div class="card"><h2>Token baru (tampil sekali)</h2><p>Cetak atau simpan sekarang. Sistem hanya menyimpan hash, jadi token tidak bisa dilihat lagi.</p><div class="tw"><table><tr><th>No</th><th>Nama</th><th>Kelas</th><th>Token</th></tr>${out.map(o=>`<tr><td>${esc(o[0])}</td><td>${esc(o[1])}</td><td>${esc(o[2])}</td><td class="tok"><b>${o[3]}</b></td></tr>`).join('')}</table></div><button class="btn sm noprint" style="margin-top:.75rem" onclick="print()">Cetak</button></div>`;
    $('#tk').scrollIntoView();
    out.forEach(o=>{const s=S.find(x=>x.no===o[0]);if(s)T[s.id]={used:false}});draw();
  });
  const draw=()=>{
    const t=$('#q').value.toLowerCase(),k=$('#fk').value;
    $('#tb').innerHTML=S.filter(s=>(!k||s.k===k)&&(s.n+s.no).toLowerCase().includes(t)).map(s=>{const tk=T[s.id];return`<tr><td>${esc(s.no)}</td><td>${esc(s.n)}</td><td>${esc(s.k)}</td><td>${s.on!==false?'Berhak':'Nonaktif'}</td><td>${tk?(tk.used?'<span class="tag ok">Sudah memilih</span>':'<span class="tag">Token terbit</span>'):'—'}</td>
    <td class="row">${tk?(tk.used?'':`<button class="btn sm" data-r="${s.id}">Token baru</button>`):`<button class="btn sm" data-t="${s.id}">Terbitkan token</button>`}<button class="btn sm alt" data-x="${s.id}">${s.on!==false?'Nonaktifkan':'Aktifkan'}</button></td></tr>`}).join('')||'<tr><td colspan="6">Belum ada data pemilih.</td></tr>';
    $('#tb').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>issue([b.dataset.t]));
    $('#tb').querySelectorAll('[data-r]').forEach(b=>b.onclick=guard(async()=>{if(!confirm('Ganti token siswa ini? Token lama tidak berlaku.'))return;await deleteDoc(doc(db,'tokens',T[b.dataset.r].id));delete T[b.dataset.r];await issue([b.dataset.r])}));
    $('#tb').querySelectorAll('[data-x]').forEach(b=>b.onclick=guard(async()=>{const s=S.find(x=>x.id===b.dataset.x);await updateDoc(doc(db,'students',s.id),{on:s.on===false});await log('Ubah status pemilih');shell()}));
  };
  $('#q').oninput=draw;$('#fk').onchange=draw;draw();
  $('#add').onclick=guard(async()=>{const no=$('#no').value.trim(),n=$('#nm').value.trim(),k=$('#kl').value.trim();if(!no||!n||!k)return alert('Semua kolom wajib diisi.');if(S.some(s=>s.no===no))return alert('Nomor siswa sudah ada.');await addDoc(collection(db,'students'),{no,n,k,on:true});await log('Tambah pemilih');shell()});
  $('#csv').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=guard(async()=>{const seen=new Set(S.map(s=>s.no));let bt=writeBatch(db),c=0,n=0;
    for(const l of r.result.split(/\r?\n/)){const p=l.split(/[;,]/).map(x=>x.trim());if(p.length<3||!p[0]||/^(nomor|no)\b/i.test(p[0])||seen.has(p[0]))continue;seen.add(p[0]);bt.set(doc(collection(db,'students')),{no:p[0],n:p[1],k:p[2],on:true});c++;if(++n===400){await bt.commit();bt=writeBatch(db);n=0}}
    if(n)await bt.commit();await log('Impor CSV',c+' pemilih');alert(c+' pemilih diimpor.');shell()});r.readAsText(f)};
  $('#all').onclick=()=>{const ids=S.filter(s=>s.on!==false&&!T[s.id]).map(s=>s.id);if(!ids.length)return alert('Semua pemilih aktif sudah punya token.');issue(ids)};
}

/* ---------- Kandidat ---------- */
async function pCand(m){
  const lock=['berlangsung','selesai'].includes(E.status);
  const C=(await getDocs(collection(db,'candidates'))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.urutan||0)-(b.urutan||0));
  m.innerHTML=`<h1>Kandidat</h1>${lock?'<div class="msg">Data kandidat terkunci karena pemilihan sudah dimulai.</div>':`<div class="card"><h2>Tambah kandidat</h2><div class="grid c2"><div><label>Nomor urut</label><input id="nr" type="number" min="1"></div><div><label>Urutan tampil</label><input id="od" type="number"></div><div><label>Nama calon ketua</label><input id="kt"></div><div><label>Nama calon wakil</label><input id="wk"></div></div>
  <label>Foto pasangan</label><input type="file" id="ph" accept="image/*"><img id="pp" alt="" style="max-height:120px;margin-top:.5rem;border-radius:10px"><label>Visi</label><textarea id="vs"></textarea><label>Misi</label><textarea id="ms"></textarea><label>Program kerja</label><textarea id="pg"></textarea><button class="btn" id="sv" style="margin-top:1rem">Simpan kandidat</button></div>`}
  <div class="grid c2">${C.map(c=>`<div class="card" style="margin:0">${c.foto?`<img src="${esc(c.foto)}" alt="" style="width:100%;max-height:160px;object-fit:cover;border-radius:10px">`:''}<h2>No. ${esc(c.nomor)} — ${esc(c.ketua)} &amp; ${esc(c.wakil)}</h2><p><b>Visi:</b> ${esc(c.visi)}</p>${lock?'':`<button class="btn red sm" data-d="${c.id}">Hapus</button>`}</div>`).join('')||'<div class="card">Belum ada kandidat yang tersedia.</div>'}</div>`;
  if(lock)return;let foto='';
  $('#ph').onchange=guard(async e=>{const f=e.target.files[0];if(!f)return;if(!/^image\/(png|jpeg|webp)$/.test(f.type)||f.size>5e6)return alert('Foto harus PNG/JPG/WEBP maksimal 5 MB.');foto=await img2url(f,640,'image/jpeg',.72);$('#pp').src=foto});
  $('#sv').onclick=guard(async()=>{const g=i=>$('#'+i).value.trim(),nomor=+g('nr');if(!nomor||!g('kt')||!g('wk'))return alert('Nomor urut, nama ketua, dan nama wakil wajib diisi.');if(C.some(c=>c.nomor===nomor))return alert('Nomor urut sudah dipakai.');
    await addDoc(collection(db,'candidates'),{nomor,ketua:g('kt'),wakil:g('wk'),visi:g('vs'),misi:g('ms'),program:g('pg'),foto,urutan:+g('od')||nomor,aktif:true});await log('Tambah kandidat','No. '+nomor);shell()});
  m.querySelectorAll('[data-d]').forEach(b=>b.onclick=guard(async()=>{if(!confirm('Hapus kandidat ini?'))return;await deleteDoc(doc(db,'candidates',b.dataset.d));await log('Hapus kandidat');shell()}));
}

/* ---------- Pengaturan pemilihan ---------- */
async function pSet(m){
  m.innerHTML=`<h1>Pengaturan Pemilihan</h1><div class="card"><p>Status: <span class="tag">${ST[E.status]}</span> · Zona waktu: Asia/Jakarta · Waktu mulai/selesai diperiksa oleh server.</p>
  <label>Nama pemilihan</label><input id="nm" value="${esc(E.nama)}"><label>Periode</label><input id="pr" value="${esc(E.periode||'')}">
  <div class="grid c2"><div><label>Mulai</label><input type="datetime-local" id="st" value="${loc(E.mulai)}"></div><div><label>Selesai</label><input type="datetime-local" id="en" value="${loc(E.selesai)}"></div></div>
  <div class="row" style="margin-top:1rem"><button class="btn" id="sv">Simpan</button><button class="btn alt" id="rd">Tandai siap</button><button class="btn" id="op">Buka pemilihan</button><button class="btn red" id="cl">Tutup pemilihan</button></div></div>`;
  const setS=guard(async(to,msg)=>{if(!confirm(msg))return;if(to!=='selesai'&&!(await cnt('candidates')))return alert('Tambahkan kandidat terlebih dahulu.');await updateDoc(doc(db,'elections','main'),{status:to});await log('Status pemilihan',ST[to]);shell()});
  $('#sv').onclick=guard(async()=>{const a=$('#st').value,b=$('#en').value;if(a&&b&&new Date(b)<=new Date(a))return alert('Waktu selesai harus setelah waktu mulai.');await updateDoc(doc(db,'elections','main'),{nama:$('#nm').value.trim(),periode:$('#pr').value.trim(),mulai:a?Timestamp.fromDate(new Date(a)):null,selesai:b?Timestamp.fromDate(new Date(b)):null});await log('Ubah pengaturan pemilihan');shell()});
  $('#rd').onclick=()=>setS('siap','Tandai pemilihan siap?');
  $('#op').onclick=()=>setS('berlangsung','Buka pemilihan? Data kandidat akan terkunci.');
  $('#cl').onclick=()=>setS('selesai','Tutup pemilihan? Pemilih tidak bisa lagi memberikan suara.');
}

/* ---------- Hasil ---------- */
async function pRes(m){
  if(E.status!=='selesai'){m.innerHTML='<h1>Hasil</h1><div class="msg">Hasil baru bisa dilihat setelah pemilihan ditutup.</div>';return}
  const [bd,cd,cl,sd]=await Promise.all([getDocs(collection(db,'ballots')),getDocs(collection(db,'candidates')),cnt('claims'),getDocs(collection(db,'students'))]);
  const tot=bd.size,N={};bd.docs.forEach(d=>{const c=d.data().c;N[c]=(N[c]||0)+1});
  const C=cd.docs.map(d=>({id:d.id,...d.data(),n:N[d.id]||0})).sort((a,b)=>a.nomor-b.nomor),sum=C.reduce((a,c)=>a+c.n,0),el=sd.docs.filter(d=>d.data().on!==false).length;
  m.innerHTML=`<h1>Hasil</h1><div class="grid s"><div class="card stat" style="margin:0"><b>${tot}</b><span>Suara masuk</span></div><div class="card stat" style="margin:0"><b>${sum}</b><span>Suara sah</span></div><div class="card stat" style="margin:0"><b>${el?Math.round(cl/el*100):0}%</b><span>Partisipasi</span></div></div>
  ${sum===tot&&tot===cl?'<div class="msg">Pemeriksaan: jumlah suara, suara sah, dan token terpakai cocok.</div>':`<div class="msg" style="background:#fde7e5">Peringatan: suara masuk (${tot}), suara sah (${sum}), dan token terpakai (${cl}) tidak sama. Periksa sebelum mengumumkan hasil.</div>`}
  <div class="card">${C.map(c=>{const p=tot?c.n/tot*100:0;return`<div><b>No. ${esc(c.nomor)} ${esc(c.ketua)} &amp; ${esc(c.wakil)}</b> — ${c.n} suara (${p.toFixed(1)}%)<div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')||'Belum ada kandidat.'}
  <div class="row noprint"><button class="btn" id="ex">Ekspor CSV</button><button class="btn alt" onclick="print()">Ekspor PDF (cetak)</button></div></div>`;
  $('#ex').onclick=()=>{const q=v=>'"'+String(v).replace(/"/g,'""')+'"',csv='Nomor urut,Ketua,Wakil,Suara,Persen\n'+C.map(c=>[c.nomor,c.ketua,c.wakil,c.n,tot?(c.n/tot*100).toFixed(1):0].map(q).join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='hasil-evote-osim.csv';a.click();log('Ekspor hasil CSV')};
}

/* ---------- Audit ---------- */
async function pAud(m){
  const d=await getDocs(query(collection(db,'audit'),orderBy('t','desc'),limit(150)));
  m.innerHTML=`<h1>Audit Aktivitas</h1><div class="card tw"><table><tr><th>Waktu</th><th>Admin</th><th>Aktivitas</th><th>Detail</th></tr>${d.docs.map(x=>{const a=x.data();return`<tr><td>${fmt(a.t)}</td><td>${esc(a.by)}</td><td>${esc(a.aksi)}</td><td>${esc(a.detail)}</td></tr>`}).join('')||'<tr><td colspan="4">Belum ada aktivitas.</td></tr>'}</table></div>`;
}
</script>
</body>
</html>
